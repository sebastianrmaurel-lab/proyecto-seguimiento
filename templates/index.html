<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seguimiento de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .sidebar { background-color: #0f172a; color: white; height: 100vh; padding: 20px; }
        .search-container { margin-top: 100px; text-align: center; }
        .btn-buscar { background-color: #2563eb; color: white; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <h4>Seguimiento</h4>
                <p>🔍 Búsqueda</p>
                <p>👤 Clientes</p>
            </div>
            
            <div class="col-md-10">
                <div class="search-container">
                    <h1>Buscar Cliente</h1>
                    <p>Ingrese el RUT para ver el estado y seguimiento.</p>
                    
                    <form method="POST" class="d-inline-block w-50">
                        <div class="input-group mb-3">
                            <input type="text" name="rut" class="form-control" placeholder="Ej: 12.345.678-9">
                            <button class="btn btn-buscar" type="submit">Buscar</button>
                        </div>
                    </form>

                    {% if cliente %}
                    <div class="card mt-4 mx-auto" style="width: 18rem;">
                        <div class="card-body">
                            <h5 class="card-title">{{ cliente.nombre }}</h5>
                            <p class="card-text"><strong>Tarea:</strong> {{ cliente.tarea }}</p>
                            <p class="card-text"><strong>Correo:</strong> {{ cliente.estado_correo }}</p>
                        </div>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
