<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Consulta - Seguimiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; }
        .navbar-brand { font-weight: 700; color: #003082 !important; }
        .btn-primary { background-color: #003082; border-color: #003082; font-weight: 600; padding: 10px 25px; }
        .btn-primary:hover { background-color: #00225c; border-color: #00225c; }
        .search-container { max-width: 650px; margin: 80px auto 40px auto; text-align: center; }
        .search-box { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .main-title { font-weight: 800; color: #111; font-size: 2.5rem; margin-bottom: 15px; }
        .result-card { max-width: 850px; margin: 20px auto; background: #ffffff; border-radius: 16px; border: none; box-shadow: 0 4px 25px rgba(0,0,0,0.05); overflow: hidden; }
        .card-status-header { padding: 20px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .badge-critico { background-color: #CF142B; color: white; padding: 8px 16px; border-radius: 50px; font-weight: 600; }
        .badge-advertencia { background-color: #ffc107; color: #000; padding: 8px 16px; border-radius: 50px; font-weight: 600; }
        .badge-normal { background-color: #003082; color: white; padding: 8px 16px; border-radius: 50px; font-weight: 600; }
        .step-indicator { font-size: 1.5rem; font-weight: 700; color: #003082; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-circle-fill me-2" style="color: #003082; font-size: 0.8rem;"></i>Seguimiento</a>
            <a href="/admin" class="btn btn-outline-secondary btn-sm"><i class="bi bi-shield-lock me-1"></i> Administración</a>
        </div>
    </nav>

    <div class="container">
        <div class="search-container">
            <span class="badge bg-light text-primary border px-3 py-2 mb-3 text-uppercase tracking-wider fw-bold" style="font-size: 0.75rem;">Portal de Consulta</span>
            <h1 class="main-title">Consulta el estado de tu trámite</h1>
            <p class="text-muted mb-4">Ingresa tu RUT para conocer el avance, etapas actuales y alertas vigentes.</p>
            
            <div class="search-box">
                <form id="searchForm" class="row g-2">
                    <div class="col-md-9">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-card-text text-muted"></i></span>
                            <input type="text" id="rutInput" class="form-control bg-light border-start-0" placeholder="Ej: 12.345.678-9" required>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">Buscar</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="resultadosContainer"></div>
    </div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rut = document.getElementById('rutInput').value.strip();
            const response = await fetch(`/api/buscar?rut=${rut}`);
            const contratos = await response.json();
            
            const container = document.getElementById('resultadosContainer');
            container.innerHTML = '';

            if (contratos.length === 0) {
                container.innerHTML = `<div class="alert alert-custom text-center max-width-650 mx-auto bg-white border shadow-sm p-4 rounded-4" style="max-width: 650px;">
                    <i class="bi bi-exclamation-circle text-danger h3 d-block mb-2"></i> No se encontraron registros para el RUT ingresado.
                </div>`;
                return;
            }

            contratos.forEach(c => {
                let alertaBadge = `<span class="badge badge-normal">Estado: Normal</span>`;
                if (c.alerta === 'critico') alertaBadge = `<span class="badge badge-critico"><i class="bi bi-exclamation-triangle-fill me-1"></i> Crítico</span>`;
                if (c.alerta === 'advertencia') alertaBadge = `<span class="badge badge-advertencia"><i class="bi bi-clock-history me-1"></i> Advertencia</span>`;

                container.innerHTML += `
                    <div class="card result-card animated fadeIn">
                        <div class="card-status-header bg-light">
                            <div>
                                <h4 class="mb-1 fw-bold text-dark">${c.empresa}</h4>
                                <small class="text-muted">Código Seguimiento: <strong>${c.codigo || 'N/A'}</strong></small>
                            </div>
                            <div>${alertaBadge}</div>
                        </div>
                        <div class="card-body p-4">
                            <div class="row text-center g-3">
                                <div class="col-6 col-md-3 border-end">
                                    <span class="text-muted d-block small text-uppercase fw-semibold">Etapa Actual</span>
                                    <span class="step-indicator">Etapa ${c.etapa}</span>
                                </div>
                                <div class="col-6 col-md-3 border-end">
                                    <span class="text-muted d-block small text-uppercase fw-semibold">Visado</span>
                                    <span class="h5 fw-bold text-capitalize ${c.visado === 'si' ? 'text-success' : 'text-secondary'}">${c.visado}</span>
                                </div>
                                <div class="col-6 col-md-3 border-end">
                                    <span class="text-muted d-block small text-uppercase fw-semibold">Observación</span>
                                    <span class="h5 fw-bold ${c.tiene_observacion ? 'text-danger' : 'text-success'}">${c.tiene_observacion ? 'Sí' : 'No'}</span>
                                </div>
                                <div class="col-6 col-md-3">
                                    <span class="text-muted d-block small text-uppercase fw-semibold">Estado General</span>
                                    <span class="h5 fw-bold text-dark text-capitalize">${c.estado.replace('_', ' ')}</span>
                                </div>
                            </div>
                            
                            <div class="mt-4 p-3 bg-light rounded-3 border-start border-primary border-3">
                                <div class="row">
                                    <div class="col-md-6">
                                        <p class="mb-1 small"><strong>Descripción:</strong> ${c.descripcion || 'Sin descripción adicional.'}</p>
                                        <p class="mb-0 small"><strong>Responsable Asignado:</strong> ${c.responsable || 'No especificado'}</p>
                                    </div>
                                    <div class="col-md-6 text-md-end mt-2 mt-md-0">
                                        <p class="mb-1 small"><strong>Fecha Límite:</strong> ${c.fecha_fin || 'No definida'}</p>
                                        <p class="mb-0 small"><strong>Días Restantes:</strong> <span class="badge bg-dark">${c.dias_restantes !== null ? c.dias_restantes : 'N/A'} días</span></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
